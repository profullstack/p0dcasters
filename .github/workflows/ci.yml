name: ci

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test:
    name: install, typecheck, test, build (Bun)
    runs-on: ubuntu-latest
    # The crawler's SQL is tested against a real Postgres: those tests skip without
    # TEST_DATABASE_URL, and a scheduling query cannot be proved any other way.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The version comes from packageManager in package.json, the same Bun the
      # image (.nixpacks/Dockerfile) pins.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # The build must not need the database (it runs in the image, with no
      # DATABASE_URL): routes that read Postgres render per request.
      - run: bun run build
